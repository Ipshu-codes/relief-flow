name: rahat_mobile
description: Offline-first disaster response app (BLE mesh SOS).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  geolocator: ^11.0.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  provider: ^6.1.1
  flutter_blue_plus: ^1.31.5
  uuid: ^4.6.0
  url_launcher: ^6.3.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
